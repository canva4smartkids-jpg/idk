<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#050c0a;
    --green:#0a5a42;        /* GITAM green */
    --green-hi:#13896a;
    --royal:#1e3fae;        /* CM Trophy blue */
    --gold:#d8b46a;         /* champagne gold — CM yellow, refined */
    --gold-hi:#f3dfae;
    --bronze:#c08a62;
    --paper:#f4efe6;
    --muted:rgba(244,239,230,.62);
    --hair:rgba(216,180,106,.38);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1080px;height:1350px;overflow:hidden;background:var(--ink)}
  .post{position:relative;width:1080px;height:1350px;overflow:hidden;color:var(--paper);
    font-family:'Archivo',sans-serif;
    background:
      radial-gradient(620px 620px at 50% 54%, rgba(19,137,106,.55), transparent 70%),
      radial-gradient(700px 500px at 100% 0%, rgba(30,63,174,.35), transparent 70%),
      radial-gradient(600px 600px at 0% 100%, rgba(10,90,66,.45), transparent 70%),
      linear-gradient(180deg,#07120f 0%, #061411 55%, #040a08 100%);}

  /* film grain */
  .grain{position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay;pointer-events:none;z-index:20}

  /* fine vertical light beams like the stage rig */
  .beam{position:absolute;top:-40px;width:220px;height:900px;transform-origin:top center;
    background:linear-gradient(180deg,rgba(243,223,174,.10),transparent 80%);filter:blur(18px)}
  .b1{left:330px;transform:rotate(14deg)} .b2{left:560px;transform:rotate(-12deg)}

  /* ── logo zone (kept empty) ─────────────────── */
  .logo-zone{position:absolute;left:0;right:0;top:0;height:150px}

  /* meta row */
  .meta{position:absolute;left:72px;right:72px;top:168px;display:flex;justify-content:space-between;
    font-size:15px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);
    font-variation-settings:'wdth' 100}
  .meta::after{content:"";position:absolute;left:0;right:0;top:30px;height:1px;background:var(--hair)}

  /* background word */
  .ghost{position:absolute;left:0;right:0;top:470px;text-align:center;
    font-weight:900;font-size:300px;line-height:.8;letter-spacing:-.01em;
    font-variation-settings:'wdth' 62;text-transform:uppercase;
    color:transparent;-webkit-text-stroke:1.5px rgba(216,180,106,.22)}

  .headline{position:absolute;left:0;right:0;top:214px;text-align:center;
    font-family:'Instrument Serif',serif;font-style:italic;font-size:150px;line-height:1;letter-spacing:-.01em;
    background:linear-gradient(180deg,var(--gold-hi) 10%,var(--gold) 60%,#a9853f 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;z-index:6}

  .halo{position:absolute;left:290px;top:400px;width:500px;height:500px;border-radius:50%;
    border:1px solid rgba(216,180,106,.28);z-index:3;box-shadow:0 0 120px rgba(19,137,106,.35) inset}
  /* subject */
  .subject{position:absolute;left:170px;top:338px;width:750px;z-index:4;
    filter:drop-shadow(0 0 1px rgba(243,223,174,.35)) drop-shadow(0 30px 60px rgba(0,0,0,.55)) contrast(1.05) saturate(.82) brightness(.97);}
  .floor{position:absolute;left:0;right:0;bottom:0;height:460px;z-index:5;
    background:linear-gradient(180deg,rgba(5,12,10,0) 0%,rgba(5,12,10,.9) 22%,#050c0a 40%)}

  /* bottom copy */
  .copy{position:absolute;left:72px;right:72px;bottom:62px;z-index:8}
  .for{font-family:'Instrument Serif',serif;font-style:italic;font-size:30px;color:var(--gold);letter-spacing:.01em}
  .name{font-weight:800;font-size:97px;white-space:nowrap;line-height:.92;margin-top:6px;text-transform:uppercase;
    letter-spacing:-.005em;font-stretch:66%;color:var(--paper)}
  .event{font-size:18px;font-weight:500;letter-spacing:.06em;color:var(--muted);margin-top:16px;
    font-variation-settings:'wdth' 100}
  .event b{color:var(--paper);font-weight:600}

  .results{display:grid;grid-template-columns:1fr 1fr;margin-top:30px;border-top:1px solid var(--hair)}
  .r{padding:22px 0 0}
  .r + .r{padding-left:36px;border-left:1px solid var(--hair)}
  .r-k{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;letter-spacing:.34em;
    text-transform:uppercase;color:var(--c);font-variation-settings:'wdth' 100}
  .r-k i{width:10px;height:10px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,var(--hi),var(--c) 60%)}
  .r-v{font-family:'Instrument Serif',serif;font-size:44px;line-height:1.02;margin-top:10px;color:var(--paper)}
  .r-s{font-size:15px;font-weight:500;letter-spacing:.04em;color:var(--muted);margin-top:8px;line-height:1.35;
    font-variation-settings:'wdth' 100}
  .gold{--c:var(--gold);--hi:var(--gold-hi)}
  .bronze{--c:var(--bronze);--hi:#ecc3a2}
</style>
</head>
<body>
<div class="post">
  <svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="beam b1"></div><div class="beam b2"></div>

  <div class="logo-zone"></div>

  <div class="meta"><span>GITAM Sports</span><span>CM Trophy 2026 · Tamil Nadu</span></div>

  <div class="headline">Congratulations</div>

  <div class="halo"></div>
  <img class="subject" src="subject.png" alt="">
  <div class="floor"></div>

  <div class="copy">
    <div class="for">on winning Gold &amp; Bronze</div>
    <div class="name">Sreesanth Mandalapu</div>
    <div class="event"><b>Chief Minister's Trophy 2026</b> &nbsp;·&nbsp; Tamil Nadu &nbsp;·&nbsp; Esports</div>

    <div class="results">
      <div class="r gold">
        <div class="r-k"><i></i>Gold</div>
        <div class="r-v">Street Fighter 6</div>
        <div class="r-s">Individual</div>
      </div>
      <div class="r bronze">
        <div class="r-k"><i></i>Bronze</div>
        <div class="r-v">Valorant</div>
        <div class="r-s">Kaiser Impact X Team Thamizh Valor</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
